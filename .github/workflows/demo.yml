name: Build & Deploy Spring Boot

on:
  push:
    branches:
      - demo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java (Corretto 17)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP_2 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_SERVER_2 }}
          port: ${{ secrets.SERVER_PORT }}
          source: "target/*.jar"
          target: "/opt/spring/releases"
          strip_components: 1
          overwrite: true
          debug: true
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP_2 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY_SERVER_2 }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            JAR_NAME=$(ls -t /opt/spring/releases/*.jar | head -n 1)
            ln -sfn "$JAR_NAME" /opt/spring/gateway.jar
            sudo systemctl restart gateway
            sudo systemctl status gateway --no-pager
